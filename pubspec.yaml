name: cusco_limpio_flutter
description: Prototipo academico Flutter de reportes de residuos y puntos demostrativos de recoleccion en Cusco.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.5.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^8.3.2
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  shared_preferences: ^2.5.3
  crypto: ^3.0.6
  image_picker: ^1.2.4
  path_provider: ^2.1.6
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/images/
